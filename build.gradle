plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = mod_group_id
version = "${mod_version}+mc${minecraft_version}"

base {
    archivesName = "${mod_disname}${mod_name}-${minecraft_version}-${mod_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    // The 1.21.1 dependency mods are kept in libs/ (same convention as the 1.20.1 branch).
    // Note: with NeoForge 1.20.2+ production runs on Mojang official names, so the old
    // `fg.deobf(...)` wrapper is no longer needed for them.
    flatDir { dirs 'libs' }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = project.neo_version

    // src/main/resources/META-INF/accesstransformer.cfg is currently empty; enable this line if the
    // port ever needs an access transformer:
    // accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run')
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            gameDirectory = project.file('run-data')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Required dependencies (1.21.1 builds, drop the jars into libs/):
    //   libs/epicfight.jar          epic-fight-21.17.3.1-mc1.21.1-neoforge.jar
    //   libs/touhoulittlemaid.jar   touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar
    //   libs/epic_fight_avalon.jar  epic_fight_avalon-neoforge1.21.1-21.12.6.2.jar
    //                               (use the build bundled inside NightFall 3.4.0 — the standalone
    //                                21.12.6.2 build still references EpicFight's removed
    //                                api/client/neoevent package and crashes at mixin apply)
    //   libs/nightfall.jar          NightFall-1.21.1-Neoforge-3.4.0.jar  (optional at runtime)
    implementation files('libs/epicfight.jar')
    implementation files('libs/touhoulittlemaid.jar')
    implementation files('libs/epic_fight_avalon.jar')
    implementation files('libs/nightfall.jar')

    // NightFall's own mandatory dependencies (runtime only, not needed to compile this mod):
    //   libs/invincible.jar         invincible-21.15.8.2-mc1.21.1-neoforge.jar
    //   libs/geckolib.jar           geckolib-neoforge-1.21.1-4.9.3.jar

    // Maven alternative to libs/ (fill in the file ids if you prefer this):
    // implementation "maven.modrinth:epic-fight:${epicfight_version}"
    // implementation "curse.maven:touhou-little-maid-355044:<fileId>"
    // implementation "curse.maven:epic-fight-avalon-1268823:<fileId>"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "ef_tlm",
                "Specification-Vendor"    : "XcS",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "XcS",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
